<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L12,6 L0,12" fill="none" stroke="#222" stroke-width="1.6"/>
</marker>
</defs>
<rect width="1100" height="790" fill="#fff"/>

<!-- fronteira do sistema -->
<rect x="220" y="50" width="640" height="700" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="540" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">SiGAT – Sistema de Gestão e Acompanhamento de Treinos</text>

<!-- ator Aluno -->
<g stroke="#222" stroke-width="2" fill="none">
<circle cx="90" cy="360" r="14"/>
<line x1="90" y1="374" x2="90" y2="418"/>
<line x1="62" y1="390" x2="118" y2="390"/>
<line x1="90" y1="418" x2="68" y2="452"/>
<line x1="90" y1="418" x2="112" y2="452"/>
</g>
<text x="90" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Aluno</text>

<!-- ator Instrutor -->
<g stroke="#222" stroke-width="2" fill="none">
<circle cx="1010" cy="240" r="14"/>
<line x1="1010" y1="254" x2="1010" y2="298"/>
<line x1="982" y1="270" x2="1038" y2="270"/>
<line x1="1010" y1="298" x2="988" y2="332"/>
<line x1="1010" y1="298" x2="1032" y2="332"/>
</g>
<text x="1010" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Instrutor</text>

<!-- associações do Aluno -->
<g stroke="#222" stroke-width="1.4">
<line x1="112" y1="400" x2="275" y2="120"/>
<line x1="112" y1="400" x2="275" y2="210"/>
<line x1="112" y1="400" x2="275" y2="310"/>
<line x1="112" y1="400" x2="275" y2="410"/>
<line x1="112" y1="400" x2="275" y2="510"/>
<line x1="112" y1="400" x2="275" y2="610"/>
<line x1="112" y1="400" x2="275" y2="700"/>
</g>

<!-- associações do Instrutor -->
<g stroke="#222" stroke-width="1.4">
<line x1="988" y1="290" x2="795" y2="120"/>
<line x1="988" y1="290" x2="465" y2="210"/>
<line x1="988" y1="290" x2="795" y2="510"/>
</g>

<!-- include / extend -->
<g stroke="#222" stroke-width="1.4" stroke-dasharray="7,5" fill="none">
<line x1="465" y1="310" x2="604" y2="310" marker-end="url(#arr)"/>
<line x1="605" y1="410" x2="466" y2="410" marker-end="url(#arr)"/>
<line x1="605" y1="610" x2="466" y2="610" marker-end="url(#arr)"/>
</g>
<text x="535" y="300" text-anchor="middle" font-size="13" fill="#222">«include»</text>
<text x="535" y="400" text-anchor="middle" font-size="13" fill="#222">«extend»</text>
<text x="535" y="600" text-anchor="middle" font-size="13" fill="#222">«extend»</text>

